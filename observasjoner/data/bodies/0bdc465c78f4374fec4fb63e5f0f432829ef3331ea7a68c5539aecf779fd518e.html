ody-href="lov/2004-03-05-12/§17" href="https://lovdata.no/lov/2004-03-05-12/§17">§ 17</a> femte ledd, <a data-source-body-href="lov/2004-03-05-12/§23" href="https://lovdata.no/lov/2004-03-05-12/§23">§ 23</a> annet punktum og <a data-source-body-href="lov/2004-03-05-12/§33" href="https://lovdata.no/lov/2004-03-05-12/§33">§ 33</a> første og annet ledd.</article></section><section class="section" data-lovdata-URL="DEL/forskrift/2004-12-21-1724/KAPITTEL_2" data-name="kapII" id="kapittel-2"><h2 data-text-align="center">II</h2><article class="legalP" id="kapittel-2-ledd-1">Bestemmelsen under I trer i kraft straks.</article></section></main></body></html>
