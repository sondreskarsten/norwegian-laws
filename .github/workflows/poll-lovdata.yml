name: Poll Lovdata for updates

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare Lovdata manifest against stored state
        id: check
        run: |
          PYTHONPATH=lovdata-loader/src python - <<'PY'
          import json, os
          from pathlib import Path
          from lovdata_loader.download import fetch_source_manifest, select_source_manifest
          current = fetch_source_manifest()
          path = Path('.github/state/lovdata-published.json')
          stored = select_source_manifest(json.loads(path.read_text())) if path.exists() else []
          changed = current != stored
          print('New or not-yet-published source input' if changed else 'Source input already published and read back')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
          PY

      - name: Dispatch lovdata-updated event
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=lovdata-updated
