name: Update laws and deploy book

on:
  repository_dispatch:
    types: [lovdata-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lovdata-loader/**'
      - 'lovdata-publisher/**'
      - 'book/**'
      - '_quarto.yml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-laws:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline and verification dependencies
        run: pip install -e 'lovdata-loader/[test]' -e 'lovdata-publisher/[test]'

      - name: Verify pipeline before processing production input
        run: |
          python -m pytest lovdata-loader/tests lovdata-publisher/tests .github/tests -q

      - name: Download and parse laws
        run: lovdata-load --download --output snapshot

      - name: Completeness gate
        run: |
          python -m lovdata_loader.coverage \
            snapshot/gjeldende-lover.tar.bz2 \
            --mean 0.999 --min 0.50 --max-structural 0
          python -m lovdata_loader.coverage \
            snapshot/gjeldende-sentrale-forskrifter.tar.bz2 \
            --mean 0.999 --min 0.50 --max-structural 5

      - name: Format laws and generate Quarto chapters
        run: lovdata-publish --snapshot snapshot --output . --quarto

      - name: Update 'Recent amendments' section in README
        run: python -m lovdata_publisher.readme_updater README.md snapshot/amendments.db

      - name: Compute delta of changed law files
        id: delta
        run: |
          python3 .github/scripts/extract_delta.py > /tmp/delta.md
          if [ -s /tmp/delta.md ]; then
            echo "has_delta=true" >> $GITHUB_OUTPUT
            echo "--- delta briefing ---"
            cat /tmp/delta.md
          else
            echo "has_delta=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate AI summary via GitHub Models
        if: steps.delta.outputs.has_delta == 'true'
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          system-prompt: |
            Du oppsummerer nye norske lover og forskrifter publisert i Norsk Lovtidend.
            For hver oppføring får du tittel, departement og selve tekstendringen: diff-utdrag
            (linjer med + er lagt til, - er fjernet, med linjetelling +N/-M) for endringer,
            eller formålsutdrag for nye dokumenter.
            Skriv på bokmål. Faktabasert og svært konsist, ingen pynt eller verdiladede adjektiv.
            Format:
            - Høyst én innledende setning som sier hvor mange dokumenter som er endret.
            - Deretter én linje per oppføring i stilen til en git commit-melding:
              "refid: <type> — <substans>". Klassifiser <type> ut fra diffen:
              bare +-linjer = tilføyelse; bare −-linjer = oppheving; +/− på samme bestemmelse
              = endring; gjennomgripende +/− (høy +N/-M) = full revisjon.
              For en endring, vis overgangen gammel → ny (f.eks. "gebyr 3000 → 5000 kr",
              "frist 1. mars → 1. juni", "terskel 10 → 15 m"). For tilføyelse: oppgi hva som
              innføres. For oppheving: oppgi hva som fjernes. Beskriv substansen (krav, satser,
              beløp, frister, terskler, paragrafer), ikke tittelen.
            - En endringskilde som treffer mange dokumenter får én linje med kort beskrivelse av
              endringen og antall berørte dokumenter, ikke én linje per dokument.
            Hvis tekstendringen ikke gir nok til en konkret beskrivelse, skriv kort hva
            dokumentet regulerer ut fra tittelen.
            Ikke spekuler om virkninger, intensjon eller politisk kontekst, og ikke vurder
            viktighet eksplisitt — oppgi fakta, la leseren vurdere.
          prompt-file: /tmp/delta.md
          max-tokens: 1500

      - name: Flag failed or empty AI summary
        if: steps.delta.outputs.has_delta == 'true' && (steps.ai.outcome != 'success' || steps.ai.outputs.response == '')
        run: echo "::warning::AI summary produced no response (outcome=${{ steps.ai.outcome }}) despite a non-empty delta"

      - name: Inject AI summary into README, RELEASES.md, commit body
        if: steps.delta.outputs.has_delta == 'true' && steps.ai.outputs.response != ''
        env:
          SUMMARY: ${{ steps.ai.outputs.response }}
        run: python3 .github/scripts/inject_summary.py

      - name: Record the manifest actually processed
        run: |
          mkdir -p .github/state
          cp snapshot/source-manifest.json .github/state/lovdata-manifest.json

      - name: Commit law updates
        id: commit
        run: |
          git config user.name "Lovtidend"
          git config user.email "lovtidend@lovdata.no"
          # Feeds and feed.xml are NOT committed — they're build artifacts
          # regenerated every run from snapshot/amendments.db. They go straight
          # into deploy-book via the snapshot artifact.
          git add lover/ forskrifter/ book/ _quarto.yml index.qmd laws.json README.md RELEASES.md .github/state/
          git rm -r --cached historie/ 2>/dev/null || true
          git rm --cached feed.xml 2>/dev/null || true
          git add historie/
          if git diff --staged --quiet; then
            echo "No changes to laws"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            if [ -f /tmp/commit-msg.txt ]; then
              git commit -F /tmp/commit-msg.txt
            else
              git commit -m "Oppdater lover og forskrifter fra Lovdata API $(date +%Y-%m-%d) [skip ci]"
            fi
            python .github/scripts/push_main.py
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload snapshot for deploy-book
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            snapshot/manifest.json
            snapshot/source-manifest.json
            snapshot/amendments.db
            snapshot/laws/
            snapshot/forskrifter/
          retention-days: 7
          if-no-files-found: error

  deploy-book:
    needs: update-laws
    if: needs.update-laws.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-laws.outputs.source_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: pip install -e lovdata-loader/ -e lovdata-publisher/

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Download snapshot from update-laws
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: snapshot/

      - name: Render book
        run: quarto render

      - name: Copy laws.json to site
        run: cp laws.json _site/laws.json

      - name: Copy assets to site
        run: |
          # Belt-and-suspenders: Quarto's project.resources should copy
          # assets/, but in practice it didn't on this site (live verified:
          # /assets/banner.svg returned 404 after the resources directive was
          # added). Explicit cp avoids the issue. The 'cp -r src/. dst/'
          # pattern (with trailing dot) prevents the nesting bug where
          # 'cp -r assets _site/assets' produces _site/assets/assets/ when
          # the destination already exists.
          mkdir -p _site/assets
          cp -r assets/. _site/assets/

      - name: Generate Atom feed.xml directly into site
        run: python -m lovdata_publisher.feed snapshot _site/feed.xml

      - name: Merge law metadata into search index
        run: python -m lovdata_publisher.search_index _site laws.json

      - name: Generate per-law HTML pages and full-text search index
        run: lovdata-publish --post-render --output . --site-dir _site

      - name: Include publication identity in the site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
        run: |
          python .github/scripts/publication.py receipt --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --output _site/publication.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true

      - name: Verify the published source identity through the public site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python .github/scripts/publication.py verify --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --url "$SITE_URL/publication.json"

  acknowledge-delivery:
    needs: [update-laws, deploy-book]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: snapshot/
      - name: Acknowledge only the source verified on the public site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
        run: |
          cp snapshot/source-manifest.json .github/state/lovdata-published.json
          python .github/scripts/publication.py receipt --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --output .github/state/publication.json
          git config user.name "Lovtidend"
          git config user.email "lovtidend@lovdata.no"
          git add .github/state/lovdata-published.json .github/state/publication.json
          if ! git diff --staged --quiet; then
            git commit -m "Record verified current-law publication [skip ci]"
            python .github/scripts/push_main.py
          fi

  chain-downstream:
    needs: [update-laws, deploy-book, acknowledge-delivery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workflow_run events from runs whose originating event was created by
      # GITHUB_TOKEN (repository_dispatch from poll-lovdata) never fire, so
      # law-history and gcs-sync went silent after the event-driven redesign.
      # workflow_dispatch is exempt from that restriction, so chain explicitly.
      - name: Dispatch law-history
        if: vars.ENABLE_LEGACY_HISTORY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run law-history.yml --ref main

      - name: Dispatch gcs-sync
        if: vars.GCS_BUCKET != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gcs-sync.yml --ref main
