name: Update laws and deploy book

on:
  repository_dispatch:
    types: [lovdata-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lovdata-loader/**'
      - 'lovdata-publisher/**'
      - 'reader-exits/**'
      - 'book/**'
      - '_quarto.yml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  issues: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-laws:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      # Always process the current tip of main, not the commit the event
      # named: a run queued behind another (concurrency group "pages") would
      # otherwise regenerate against a base that the earlier run has already
      # advanced, and push_main.py rightly refuses to rebase such output. The
      # plan step reads the publication trailers of recent commits, so the
      # checkout needs history beyond HEAD (one or two publications a day).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline and verification dependencies
        run: pip install -e 'lovdata-loader/[test]' -e 'lovdata-publisher/[test]'

      - name: Verify pipeline before processing production input
        run: |
          python -m pytest lovdata-loader/tests lovdata-publisher/tests .github/tests -q

      # Every commit on main must be either a pure source update or a pure
      # parser regeneration. The plan compares the live Lovdata manifest and
      # the parser code (lovdata-loader/, lovdata-publisher/ trees) with the
      # newest publication commit on main (normally the acknowledged one; a
      # run that failed after committing leaves main ahead of the state).
      - name: Classify this publication against the last publication on main
        id: plan
        run: python .github/scripts/provenance.py plan --output "$RUNNER_TEMP/publication-plan.json"

      - name: Restore the previously published source archives
        if: steps.plan.outputs.regenerate_previous == 'true'
        id: previous
        run: |
          python .github/scripts/provenance.py fetch-previous \
            --plan "$RUNNER_TEMP/publication-plan.json" --output "$RUNNER_TEMP/previous-sources"

      - name: Regenerate the previous sources with the changed parser
        if: steps.plan.outputs.regenerate_previous == 'true'
        run: |
          set -e
          # The receipt must be in the output directory before the loader
          # runs: write_snapshot carries it into the artifact inventory, and
          # the publisher rejects any file that is not inventoried.
          mkdir -p snapshot-previous
          cp "$RUNNER_TEMP/previous-sources/source-manifest.json" snapshot-previous/source-manifest.json
          lovdata-load --gjeldende "${{ steps.previous.outputs.gjeldende }}" \
            --forskrifter "${{ steps.previous.outputs.forskrifter }}" \
            --lovtidend ${{ steps.previous.outputs.lovtidend }} \
            --capture-source-bodies --output snapshot-previous
          PARENT=$(git rev-parse HEAD)
          lovdata-publish --snapshot snapshot-previous --output . --quarto --source-evidence-links \
            --capture-reader-exits . --capture-expected-head "$PARENT"
          python -m lovdata_publisher.readme_updater README.md snapshot-previous/amendments.db
          python .github/scripts/provenance.py verify-reproducible --snapshot snapshot-previous --output .
          python .github/scripts/provenance.py message --plan "$RUNNER_TEMP/publication-plan.json" \
            --kind parser --manifest snapshot-previous/source-manifest.json --output "$RUNNER_TEMP/parser-commit-msg.txt"
          git config user.name "Lovtidend"
          git config user.email "lovtidend@lovdata.no"
          git add lover/ forskrifter/ book/ _quarto.yml index.qmd laws.json README.md .github/state/
          git rm -r --cached historie/ 2>/dev/null || true
          git add historie/
          if [ -d reader-exits ]; then git add reader-exits/; fi
          python -m lovdata_publisher.reader_exits verify-staged --repository . \
            --expected-head "$PARENT" --snapshot snapshot-previous
          if git diff --staged --quiet; then
            echo "Changed parser produced identical output for the previous sources"
          else
            git commit -F "$RUNNER_TEMP/parser-commit-msg.txt"
            python .github/scripts/push_main.py
          fi
          rm -rf snapshot-previous

      - name: Download and parse laws
        run: lovdata-load --download --capture-source-bodies --output snapshot

      - name: Classify every amendment instruction against the wording catalogue
        run: |
          python -m lovdata_loader.instruction_catalog --db snapshot/amendments.db \
            --output "$RUNNER_TEMP/instruction-forms.json"

      - name: Open or update the issue for uncatalogued instruction wordings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/instruction_forms_issue.py \
            --report "$RUNNER_TEMP/instruction-forms.json" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Completeness gate
        run: |
          python -m lovdata_loader.coverage \
            snapshot/gjeldende-lover.tar.bz2 \
            --mean 0.999 --min 0.50 --max-structural 0
          python -m lovdata_loader.coverage \
            snapshot/gjeldende-sentrale-forskrifter.tar.bz2 \
            --mean 0.999 --min 0.50 --max-structural 5

      - name: Format laws and generate Quarto chapters
        id: format
        run: |
          READER_PARENT=$(git rev-parse HEAD)
          echo "expected_head=$READER_PARENT" >> "$GITHUB_OUTPUT"
          lovdata-publish --snapshot snapshot --output . --quarto --source-evidence-links \
            --capture-reader-exits . --capture-expected-head "$READER_PARENT"

      - name: Update 'Recent amendments' section in README
        run: python -m lovdata_publisher.readme_updater README.md snapshot/amendments.db

      # The index is derived in this run from the same parser output as the
      # Markdown (docs/NODE-HISTORY-DESIGN.md): it carries the source manifest
      # digest and parser identity, and its logical digest is verified by the
      # reproducibility gate and written to the commit as the Indeks trailer.
      - name: Build the corpus index from this run's output
        run: |
          python -m lovdata_publisher.index_build build --laws . --db snapshot/amendments.db \
            --output snapshot/laws-index.sqlite \
            --meta "kildemanifest=$(python .github/scripts/provenance.py manifest-digest --manifest snapshot/source-manifest.json)" \
            --meta "parser_loader=$(git rev-parse HEAD:lovdata-loader)" \
            --meta "parser_publisher=$(git rev-parse HEAD:lovdata-publisher)"

      - name: Verify the parser output is reproducible before committing it
        run: python .github/scripts/provenance.py verify-reproducible --snapshot snapshot --output . --index snapshot/laws-index.sqlite

      - name: Compute delta of changed law files
        id: delta
        if: steps.plan.outputs.source_changed == 'true'
        run: |
          python3 .github/scripts/extract_delta.py > /tmp/delta.md
          if [ -s /tmp/delta.md ]; then
            echo "has_delta=true" >> $GITHUB_OUTPUT
            echo "--- delta briefing ---"
            cat /tmp/delta.md
          else
            echo "has_delta=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate AI summary via GitHub Models
        if: steps.plan.outputs.source_changed == 'true' && steps.delta.outputs.has_delta == 'true'
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          system-prompt: |
            Du oppsummerer nye norske lover og forskrifter publisert i Norsk Lovtidend.
            For hver oppføring får du tittel, departement og selve tekstendringen: diff-utdrag
            (linjer med + er lagt til, - er fjernet, med linjetelling +N/-M) for endringer,
            eller formålsutdrag for nye dokumenter.
            Skriv på bokmål. Faktabasert og svært konsist, ingen pynt eller verdiladede adjektiv.
            Format:
            - Høyst én innledende setning som sier hvor mange dokumenter som er endret.
            - Deretter én linje per oppføring i stilen til en git commit-melding:
              "refid: <type> — <substans>". Klassifiser <type> ut fra diffen:
              bare +-linjer = tilføyelse; bare −-linjer = oppheving; +/− på samme bestemmelse
              = endring; gjennomgripende +/− (høy +N/-M) = full revisjon.
              For en endring, vis overgangen gammel → ny (f.eks. "gebyr 3000 → 5000 kr",
              "frist 1. mars → 1. juni", "terskel 10 → 15 m"). For tilføyelse: oppgi hva som
              innføres. For oppheving: oppgi hva som fjernes. Beskriv substansen (krav, satser,
              beløp, frister, terskler, paragrafer), ikke tittelen.
            - En endringskilde som treffer mange dokumenter får én linje med kort beskrivelse av
              endringen og antall berørte dokumenter, ikke én linje per dokument.
            Hvis tekstendringen ikke gir nok til en konkret beskrivelse, skriv kort hva
            dokumentet regulerer ut fra tittelen.
            Ikke spekuler om virkninger, intensjon eller politisk kontekst, og ikke vurder
            viktighet eksplisitt — oppgi fakta, la leseren vurdere.
          prompt-file: /tmp/delta.md
          max-tokens: 1500

      - name: Flag failed or empty AI summary
        if: steps.delta.outputs.has_delta == 'true' && (steps.ai.outcome != 'success' || steps.ai.outputs.response == '')
        run: echo "::warning::AI summary produced no response (outcome=${{ steps.ai.outcome }}) despite a non-empty delta"

      - name: Inject AI summary into README, RELEASES.md, commit body
        if: steps.delta.outputs.has_delta == 'true' && steps.ai.outputs.response != ''
        env:
          SUMMARY: ${{ steps.ai.outputs.response }}
        run: python3 .github/scripts/inject_summary.py

      - name: Record the manifest actually processed
        run: |
          mkdir -p .github/state
          cp snapshot/source-manifest.json .github/state/lovdata-manifest.json

      - name: Commit law updates
        id: commit
        run: |
          git config user.name "Lovtidend"
          git config user.email "lovtidend@lovdata.no"
          # Feeds and feed.xml are NOT committed — they're build artifacts
          # regenerated every run from snapshot/amendments.db. They go straight
          # into deploy-book via the snapshot artifact.
          git add lover/ forskrifter/ book/ _quarto.yml index.qmd laws.json README.md RELEASES.md .github/state/
          git rm -r --cached historie/ 2>/dev/null || true
          git rm --cached feed.xml 2>/dev/null || true
          git add historie/
          if [ -d reader-exits ]; then git add reader-exits/; fi
          python -m lovdata_publisher.reader_exits verify-staged --repository . \
            --expected-head "${{ steps.format.outputs.expected_head }}" --snapshot snapshot
          if git diff --staged --quiet; then
            echo "No changes to laws"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ steps.plan.outputs.source_changed }}" = "true" ]; then KIND=source; else KIND=parser; fi
            python .github/scripts/provenance.py message --plan "$RUNNER_TEMP/publication-plan.json" \
              --kind "$KIND" --manifest snapshot/source-manifest.json --index snapshot/laws-index.sqlite \
              --summary-file /tmp/commit-msg.txt --output "$RUNNER_TEMP/commit-msg.txt"
            git commit -F "$RUNNER_TEMP/commit-msg.txt"
            python .github/scripts/push_main.py
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Stamp the index with the publication commit
        if: steps.commit.outputs.source_sha != ''
        run: |
          python -m lovdata_publisher.index_build stamp --output snapshot/laws-index.sqlite \
            --meta "source_sha=${{ steps.commit.outputs.source_sha }}"
          gzip -9 -k -f snapshot/laws-index.sqlite

      - name: Publish durable source evidence and read it back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.commit.outputs.source_sha }}
        run: |
          python .github/scripts/publish_evidence.py --snapshot snapshot \
            --output "$RUNNER_TEMP/source-evidence" --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --publish
          cp "$RUNNER_TEMP/source-evidence/evidence.json" snapshot/evidence-release.json

      - name: Upload snapshot for deploy-book
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            snapshot/manifest.json
            snapshot/source-manifest.json
            snapshot/amendments.db
            snapshot/laws/
            snapshot/forskrifter/
            snapshot/raw/
            snapshot/source-observations.json
            snapshot/source-members.jsonl
            snapshot/parsed-amendment-acts.v1.jsonl
            snapshot/evidence-release.json
            snapshot/laws-index.sqlite.gz
          retention-days: 7
          if-no-files-found: error

  deploy-book:
    needs: update-laws
    if: needs.update-laws.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-laws.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: pip install -e lovdata-loader/ -e lovdata-publisher/

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Download snapshot from update-laws
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: snapshot/

      - name: Render book
        run: quarto render

      - name: Copy data and source evidence links to site
        run: |
          cp laws.json _site/laws.json
          cp snapshot/evidence-release.json _site/evidence.json
          cp snapshot/manifest.json _site/snapshot-manifest.json

      - name: Copy assets to site
        run: |
          # Belt-and-suspenders: Quarto's project.resources should copy
          # assets/, but in practice it didn't on this site (live verified:
          # /assets/banner.svg returned 404 after the resources directive was
          # added). Explicit cp avoids the issue. The 'cp -r src/. dst/'
          # pattern (with trailing dot) prevents the nesting bug where
          # 'cp -r assets _site/assets' produces _site/assets/assets/ when
          # the destination already exists.
          mkdir -p _site/assets
          cp -r assets/. _site/assets/

      - name: Generate Atom feed.xml directly into site
        run: python -m lovdata_publisher.feed snapshot _site/feed.xml

      - name: Merge law metadata into search index
        run: python -m lovdata_publisher.search_index _site laws.json

      - name: Check out the independently published history ledger
        uses: actions/checkout@v4
        with:
          repository: sondreskarsten/norwegian-laws-history
          ref: main
          path: .history-reader
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact published observed bodies for the reader
        run: |
          PYTHONPATH=.history-reader python -m law_history.reader_export \
            --repository .history-reader --output "$RUNNER_TEMP/observed-history-export"

      - name: Generate per-law HTML pages and full-text search index
        run: |
          lovdata-publish --post-render --output . --site-dir _site \
            --observed-history-export "$RUNNER_TEMP/observed-history-export"

      - name: Include publication identity in the site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
        run: |
          python .github/scripts/publication.py receipt --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --evidence snapshot/evidence-release.json \
            --output _site/publication.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true

      - name: Verify the published source identity through the public site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python .github/scripts/publication.py verify --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --evidence snapshot/evidence-release.json \
            --url "$SITE_URL/publication.json"

      # The index is an asset of the same observation release as the source
      # bundle, so the MCP server finds it through publication.json.
      - name: Attach the corpus index to the observation release
        if: hashFiles('snapshot/laws-index.sqlite.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(python -c "import json; print(json.load(open('snapshot/evidence-release.json'))['release_tag'])")
          gh release upload "$TAG" snapshot/laws-index.sqlite.gz --clobber

  acknowledge-delivery:
    needs: [update-laws, deploy-book]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: snapshot/
      - name: Acknowledge only the source verified on the public site
        env:
          SOURCE_SHA: ${{ needs.update-laws.outputs.source_sha }}
        run: |
          cp snapshot/source-manifest.json .github/state/lovdata-published.json
          python .github/scripts/publication.py receipt --sha "$SOURCE_SHA" \
            --manifest snapshot/source-manifest.json --evidence snapshot/evidence-release.json \
            --output .github/state/publication.json
          git config user.name "Lovtidend"
          git config user.email "lovtidend@lovdata.no"
          git add .github/state/lovdata-published.json .github/state/publication.json
          if ! git diff --staged --quiet; then
            git commit -m "Record verified current-law publication [skip ci]"
            python .github/scripts/push_main.py
          fi

  chain-downstream:
    needs: [update-laws, deploy-book, acknowledge-delivery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workflow_run events from runs whose originating event was created by
      # GITHUB_TOKEN (repository_dispatch from poll-lovdata) never fire, so
      # law-history and gcs-sync went silent after the event-driven redesign.
      # workflow_dispatch is exempt from that restriction, so chain explicitly.
      - name: Dispatch law-history
        if: vars.ENABLE_LEGACY_HISTORY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run law-history.yml --ref main

      - name: Dispatch gcs-sync
        if: vars.GCS_BUCKET != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gcs-sync.yml --ref main
