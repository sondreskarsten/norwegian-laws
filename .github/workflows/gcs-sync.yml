name: Sync to GCS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: vars.GCS_BUCKET != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only committed public product files
        run: python .github/scripts/publication.py stage --output "$RUNNER_TEMP/law-publication"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync public product files to GCS bucket
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          gsutil -m rsync -r -d "$RUNNER_TEMP/law-publication" "gs://$GCS_BUCKET/"
