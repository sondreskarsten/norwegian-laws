name: Explain retired legacy reconstruction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-only:
    runs-on: ubuntu-latest
    steps:
      - name: Keep existing historical references unchanged
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          The legacy reconstruction workflow is retired. This run does not rebuild or push historical branches or yearly tags.

          Existing references remain available as unverified reconstructions. New source observations and qualified body products are published append-only in [norwegian-laws-history](https://github.com/sondreskarsten/norwegian-laws-history).

          The replacement records project commit dates separately from source observation and legal-time evidence. See [issue #7](https://github.com/sondreskarsten/norwegian-laws/issues/7) for remaining delivery work.
          EOF
