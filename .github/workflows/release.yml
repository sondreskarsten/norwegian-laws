name: Release

on:
  push:
    tags: ['v*.*.*']  # package releases only; yearly data tags (vYYYY) must not trigger builds
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the checked-out commit and publish, e.g. v0.5.0"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the package and citation versions
        run: |
          VERSION=${TAG#v}
          for f in lovdata-loader/pyproject.toml lovdata-publisher/pyproject.toml norwegian-laws-mcp/pyproject.toml; do
            grep -q "^version = \"$VERSION\"" "$f" || { echo "$f does not declare version $VERSION"; exit 1; }
          done
          for f in lovdata-loader/src/lovdata_loader/__init__.py lovdata-publisher/src/lovdata_publisher/__init__.py norwegian-laws-mcp/src/norwegian_laws_mcp/__init__.py; do
            grep -q "^__version__ = \"$VERSION\"" "$f" || { echo "$f does not declare version $VERSION"; exit 1; }
          done
          grep -q "^version: $VERSION$" CITATION.cff || { echo "CITATION.cff does not declare version $VERSION"; exit 1; }

      # A dispatched run tags the commit it checked out; the tag push then
      # starts a second run, which finds the release and only re-uploads.
      - name: Create and push the tag when dispatched
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag must look like vX.Y.Z"; exit 1;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists on the remote"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Build packages
        run: |
          pip install build
          python -m build lovdata-loader
          python -m build lovdata-publisher
          python -m build norwegian-laws-mcp

      # softprops/action-gh-release@v2 was used previously but it ALWAYS
      # tries to PATCH (finalize) the release after uploading assets, even
      # when --generate_release_notes is false. That PATCH errors with
      # 'already_exists: tag_name' when the release was created manually
      # via API just before the tag push, which is the v0.3.x workflow.
      # See v0.3.0 / v0.4.0 release attempts for the failure mode.
      #
      # gh CLI handles both cases cleanly: `gh release upload --clobber`
      # targets the existing release without touching the tag/body, and
      # `gh release create` is only used when no release exists yet.
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="lovdata-loader/dist/* lovdata-publisher/dist/* norwegian-laws-mcp/dist/*"
          NOTES=".github/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" $ASSETS --clobber
          elif [ -f "$NOTES" ]; then
            echo "Creating release $TAG from $NOTES..."
            gh release create "$TAG" $ASSETS --title "$TAG" --notes-file "$NOTES" --latest
          else
            echo "Release $TAG does not exist and has no notes file, creating with auto notes..."
            gh release create "$TAG" $ASSETS --generate-notes --title "$TAG" --latest
          fi
