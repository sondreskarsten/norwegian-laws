name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build packages
        run: |
          pip install build
          python -m build ./lovdata-loader
          python -m build ./lovdata-publisher
          mkdir -p dist
          cp lovdata-loader/dist/* dist/
          cp lovdata-publisher/dist/* dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
