[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norwegian-laws"
version = "0.4.0"
description = "Norwegian law texts as git history, with a Quarto book for browsing"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "lovdata-loader",
    "lovdata-publisher",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [
    "lovdata-loader/tests",
    "lovdata-publisher/tests",
]
